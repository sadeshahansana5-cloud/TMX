name: Build Kairo Code from ZIP

on:
  push:
    paths:
      - "KairoCode-source-and-ui.zip"
      - ".github/workflows/build-from-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APKs (apt-android-7)
    runs-on: ubuntu-latest
    steps:
      - name: Check out ZIP and workflow
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Extract source ZIP
        run: |
          test -f KairoCode-source-and-ui.zip
          mkdir -p extracted
          unzip -q KairoCode-source-and-ui.zip -d extracted
          test -f extracted/termux-source/termux-app-master/gradlew

      - name: Build Kairo Code debug APKs
        working-directory: extracted/termux-source/termux-app-master
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: bash ./gradlew assembleDebug

      - name: Collect APKs and checksums
        working-directory: extracted/termux-source/termux-app-master
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-out/"
          cd "$GITHUB_WORKSPACE/apk-out"
          sha256sum ./*.apk > SHA256SUMS

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Kairo-Code-debug-APKs
          path: apk-out/
          if-no-files-found: error
          retention-days: 30
