name: Build Kairo Code from ZIP

on:
  push:
    paths:
      - "KairoCode-source-and-ui.zip"
      - ".github/workflows/build-from-zip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APKs (apt-android-7)
    runs-on: ubuntu-latest
    steps:
      - name: Check out ZIP and workflow
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the action's default legacy "tools" package, which sdkmanager no longer provides.
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Extract source ZIP
        run: |
          test -f KairoCode-source-and-ui.zip
          mkdir -p extracted
          unzip -q KairoCode-source-and-ui.zip -d extracted
          test -f extracted/termux-source/termux-app-master/gradlew

      - name: Build Kairo Code debug APKs
        working-directory: extracted/termux-source/termux-app-master
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: bash ./gradlew assembleDebug

      - name: Collect each ABI APK separately
        working-directory: extracted/termux-source/termux-app-master
        run: |
          set -euo pipefail
          source_dir="app/build/outputs/apk/debug"
          output_dir="$GITHUB_WORKSPACE/apk-out"
          mkdir -p "$output_dir"
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            apk="kairo-code_apt-android-7-debug_${abi}.apk"
            test -f "$source_dir/$apk"
            mkdir -p "$output_dir/$abi"
            cp "$source_dir/$apk" "$output_dir/$abi/"
            (cd "$output_dir/$abi" && sha256sum "$apk" > SHA256SUMS)
          done

      - name: Upload universal APK
        uses: actions/upload-artifact@v6
        with:
          name: Kairo-Code-universal
          path: apk-out/universal/
          if-no-files-found: error
          retention-days: 30

      - name: Upload arm64-v8a APK (recommended for most modern Android phones)
        uses: actions/upload-artifact@v6
        with:
          name: Kairo-Code-arm64-v8a
          path: apk-out/arm64-v8a/
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v6
        with:
          name: Kairo-Code-armeabi-v7a
          path: apk-out/armeabi-v7a/
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: Kairo-Code-x86_64
          path: apk-out/x86_64/
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86 APK
        uses: actions/upload-artifact@v6
        with:
          name: Kairo-Code-x86
          path: apk-out/x86/
          if-no-files-found: error
          retention-days: 30
